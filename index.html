const diffDays = (a,b) => { const p = k => { const [y,m,d]=k.split('-').map(Number); return Date.UTC(y,m-1,d); }; return Math.round((p(b)-p(a))/864e5); };
const juzOf = (s,a) => { let j=1; for (let i=0;i<30;i++){ const [js,ja]=JUZ[i]; if (s>js || (s===js && a>=ja)) j=i+1; } return j; };
const plural = (n, one, two, few, many) => n===1?one: n===2?two: (n>=3&&n<=10)?ar(n)+' '+few : ar(n)+' '+many;
const ayahWord = n => plural(n,'آية واحدة','آيتان','آيات','آية');
const vib = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} };

function norm(w){
  return w.replace(/[ؐ-ًؚ-ٰٟۖ-ۭـ]/g,'')
    .replace(/[ٱآأإ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
    .replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[^ء-ي]/g,'');
}
const stripA = w => w.replace(/[اء]/g,'');
function lev(a,b){
  if (a===b) return 0; const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; }
  return p[n];
}
function sim(a,b){ const L=Math.max(a.length,b.length); return L ? 1-lev(a,b)/L : 1; }
const TH = { easy:[0.6,0.66], normal:[0.67,0.74], strict:[0.8,0.84] };
function match(heard, expected){
  if (!heard || !expected) return false;
  if (heard===expected) return true;
  const ha = stripA(heard), ea = stripA(expected);
  if (ha===ea) return true;
  const strict = TH[S.settings.strict] || TH.normal;
  const th = Math.min(ea.length, ha.length) <= 3 ? strict[0] : strict[1];
  return sim(heard,expected) >= th || sim(ha,ea) >= th;
}
const tokCache = {};
function tokens(s){
  if (tokCache[s]) return tokCache[s];
  return tokCache[s] = Q[s-1][3].map(v => v.split(/[\s ]+/).filter(Boolean).map(t => { const n=norm(t); return {t, n, m:!n}; }));
}
const nAyat = s => Q[s-1][3].length;
const sName = s => Q[s-1][0];

/* ---------- storage ---------- */
const KEY = 'rafeeq-hifz-v1';
const DEF = { reciter:RECITERS[0][0], size:1, repeat:3, goal:5, reads:5, theme:'system', dir:'fwd', onboarded:false, strict:'normal' };
let S = { v:2, items:[], days:[], last:null, next:null, newLog:{}, settings:Object.assign({},DEF) };
let storageOk = true;
try {
  const raw = localStorage.getItem(KEY);
  if (raw) { const o = JSON.parse(raw); S = Object.assign(S, o); S.settings = Object.assign({}, DEF, o.settings||{});
    if (!o.v){ S.v=2; if ((o.items||[]).length) S.settings.onboarded = true; S.settings.repeat = Math.max(S.settings.repeat,3); } S.newLog = S.newLog||{}; }
} catch(e){}
let MEM = new Set();
function rebuildMem(){ MEM = new Set(); S.items.forEach(it => { for (let a=it.a;a<=it.b;a++) MEM.add(it.s+':'+a); }); }
function save(){ rebuildMem(); try { localStorage.setItem(KEY, JSON.stringify(S)); storageOk=true; } catch(e){ storageOk = false; } }
rebuildMem();
function touchDay(){ const k=dkey(); if (!S.days.includes(k)) { S.days.push(k); if (S.days.length>500) S.days=S.days.slice(-500); } }
function streak(){ const set = new Set(S.days); let k = dkey(); if (!set.has(k)) k = addDays(k,-1); let n=0; while(set.has(k)){ n++; k=addDays(k,-1); } return n; }
const isMem = (s,a) => MEM.has(s+':'+a);
function surahMem(s){ let c=0; for (let a=1;a<=nAyat(s);a++) if (isMem(s,a)) c++; return c; }
function findItem(s,a,b){ return S.items.find(it => it.s===s && it.a===a && it.b===b); }
function strength(it){ return it.ivl>=21 ? ['strong','راسخ'] : (it.lapses>1 && it.ivl<7) ? ['weak','يحتاج تثبيت'] : ['','قيد التثبيت']; }
function dueList(){ const t=dkey(); return S.items.filter(it => it.due <= t).sort((a,b)=> a.due<b.due?-1:a.due>b.due?1:(a.s-b.s)||(a.a-b.a)); }

/* spaced repetition: 0 forgot, 1 hard, 2 good, 3 easy */
function nextIvl(it,g){
  if (g===0) return 1;
  if (g===1) return Math.max(1,Math.round(it.ivl*1.2));
  if (g===2) return it.reps===0 ? 1 : it.reps===1 ? 3 : Math.max(it.ivl+1,Math.round(it.ivl*it.ease));
  return it.reps===0 ? 3 : Math.max(it.ivl+2,Math.round(Math.max(it.ivl,1)*it.ease*1.3));
}
function grade(it, g){
  const today = dkey(); it.ivl = Math.min(nextIvl(it,g),365);
  if (g===0){ it.ease=Math.max(1.3,it.ease-0.2); it.lapses=(it.lapses||0)+1; it.reps=0; }
  else if (g===1){ it.ease=Math.max(1.3,it.ease-0.15); it.reps++; }
  else if (g===2){ it.reps++; }
  else { it.ease+=0.15; it.reps++; }
  it.last = today; it.due = addDays(today, it.ivl); touchDay();
}
function addItem(s,a,b){
  let it = findItem(s,a,b);
  if (!it){ it = {id:Date.now().toString(36)+Math.random().toString(36).slice(2,5), s, a, b, ease:2.5, ivl:0, reps:0, lapses:0, due:dkey(), last:null, added:dkey()}; S.items.push(it); }
  return it;
}
/* when a surah is fully covered by several portions, merge them into one review */
function consolidate(s){
  const its = S.items.filter(x=>x.s===s); if (its.length<2) return;
  rebuildMem(); if (surahMem(s)!==nAyat(s)) return;
  const m = {id:its[0].id, s, a:1, b:nAyat(s), ease:Math.min(...its.map(x=>x.ease)), ivl:Math.min(...its.map(x=>x.ivl)), reps:Math.min(...its.map(x=>x.reps)),
    lapses:Math.max(...its.map(x=>x.lapses||0)), due:its.map(x=>x.due).sort()[0], last:dkey(), added:its.map(x=>x.added||dkey()).sort()[0]};
  S.items = S.items.filter(x=>x.s!==s); S.items.push(m);
}
/* daily plan */
function nextSurah(s){ return S.settings.dir==='rev' ? (s>1? s-1 : null) : (s<114? s+1 : null); }
function nextPortion(){
  if (!S.next) return null;
  let s=S.next.s, a=S.next.a, guard=0;
  while (guard++ < 400){
    if (a>nAyat(s)){ const ns=nextSurah(s); if(!ns) return null; s=ns; a=1; continue; }
    if (isMem(s,a)){ a++; continue; }
    break;
  }
  const n=nAyat(s); let b=a; const g=S.settings.goal;
  while (b<n && b-a+1<g && !isMem(s,b+1)) b++;
  if (n-b<=2 && n-b>0 && ![...Array(n-b)].some((_,i)=>isMem(s,b+1+i))) b=n;
  return {s,a,b};
}
function advanceAfter(s,b){ return b<nAyat(s) ? {s, a:b+1} : (nextSurah(s) ? {s:nextSurah(s), a:1} : null); }

function ringSVG(p, size){
  const r=15.9, c=2*Math.PI*r; const off = c*(1-Math.max(0,Math.min(1,p)));

}

/* ---------- theme ---------- */
let themeSet=false;
function applyTheme(){
  const t=S.settings.theme, root=document.documentElement;
  if (t==='light'||t==='dark'){ root.setAttribute('data-theme',t); themeSet=true; }
  else if (themeSet){ root.removeAttribute('data-theme'); themeSet=false; }
  document.documentElement.style.setProperty('--qs', S.settings.size);
  const meta=document.querySelector('meta[name="theme-color"]'); if (meta) meta.content=getComputedStyle(root).getPropertyValue('--bg').trim()||'#F4F7F3';
}

let view = 'today', R = null, surahFilter = 'all', surahQuery = '', ob = {start:'amma', goal:5};
function setHash(h){ if (location.hash.slice(1)!==h){ try{ history.replaceState(null,'','#'+h); }catch(e){} } }
function go(v){ stopAll(); view=v; setHash(v); render(); window.scrollTo(0,0); }
function fromHash(){
  const h = location.hash.slice(1); const m = /^s(\d{1,3})$/.exec(h);
  if (m && +m[1]>=1 && +m[1]<=114){ openReader(+m[1]); return; }
  view = ['surahs','progress'].includes(h) ? h : 'today'; render();

function topHTML(title, sub){ return `<header class="top"><div class="grow hello">${title}<small>${sub}</small></div><button class="icon-btn" data-act="settings" aria-label="الإعدادات">${I.gear}</button></header>`; }
function hijri(){ try { return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{weekday:'long',day:'numeric',month:'long'}).format(new Date()); } catch(e){ return ''; } }

/* ---------- today ---------- */
function verseOfDay(){
  const k=dkey(); let h=7; for (const c of k) h=(h*31+c.charCodeAt(0))>>>0;
  let n = h % TOTAL, s=0; while (n >= Q[s][3].length){ n-=Q[s][3].length; s++; } return [s+1, n+1];
}
function relDay(k){ const d = diffDays(dkey(),k); return d<0?'متأخرة':d===0?'اليوم':d===1?'غداً':d===2?'بعد يومين':d<=10?'بعد '+ar(d)+' أيام':'بعد '+ar(d)+' يوماً'; }
function rangeLabel(s,a,b){ return (a===1 && b===nAyat(s)) ? 'السورة كاملة' : (a===b ? 'الآية '+ar(a) : 'الآيات '+ar(a)+'–'+ar(b)); }
function todayHTML(){
  const hr=new Date().getHours(); const greet = hr<12 ? 'صباح الخير' : 'مساء الخير';
  let h = topHTML(greet, hijri());
  if (!S.settings.onboarded) return h + onboardingHTML();
  const due = dueList(), p = nextPortion(), k=dkey();
  const newDone = (S.newLog[k]||0)>0;
  const reviewedToday = S.items.filter(it=>it.last===k).length;
  const totalTasks = (due.length+reviewedToday>0?1:0) + (p||newDone?1:0);
  const doneTasks = (due.length===0 && reviewedToday>0 ?1:0) + (newDone?1:0);

  let primary;

  else primary = `<button class="big" data-act="startSheet">حدّد من أين تبدأ الحفظ</button>`;
  h += `<section class="card plan" aria-label="ورد اليوم">
    <div class="plan-head"><div class="ring" aria-hidden="true">${ringSVG(pct)}<b>${ar(Math.round(pct*100))}٪</b></div>
      <div class="grow"><div class="ttl">وِرد اليوم</div><div class="sub">${doneTasks===totalTasks && totalTasks ? 'ما شاء الله، أتممت ورد اليوم' : 'المراجعة أولاً، ثم الحفظ الجديد'}</div></div></div>
    <button class="task ${due.length===0?'done':''}" data-act="${due.length?'startReview':'tab'}" data-v="progress"><span class="ic">${due.length===0?I.check:I.rep}</span><span class="grow"><span class="k">المراجعة</span><br><span class="v">${due.length ? ar(due.length)+' '+(due.length===1?'مقطع مستحق':due.length===2?'مقطعان مستحقان':'مقاطع مستحقة') : (S.items.length ? 'لا مراجعات مستحقة' : 'تبدأ بعد أول حفظ')}</span></span></button>
    <button class="task ${newDone?'done':''}" data-act="${p?'startLearn':'startSheet'}"><span class="ic">${newDone?I.check:I.plant}</span><span class="grow"><span class="k">حفظ جديد · ${ayahWord(S.settings.goal)} يومياً</span><br><span class="v">${p ? `<span class="q">${sName(p.s)}</span> · ${rangeLabel(p.s,p.a,p.b)}` : 'اختر نقطة البداية'}</span></span></button>
    ${primary}</section>`;
  const mem = MEM.size, st = streak();
  h += `<div class="stats" style="margin-top:12px">
    <div class="stat"><b>${ar(mem)}</b><span>آية محفوظة</span></div>
    <div class="stat"><b>${ar(st)}</b><span>${st===1?'يوم متتالٍ':'أيام متتالية'}</span></div>
    <div class="stat"><b>${ar(+(mem/TOTAL*100).toFixed(mem&&mem<63?2:1))}٪</b><span>من القرآن</span></div></div>`;
  if (!storageOk) h += `<p class="note">تعذّر حفظ التقدّم في هذا المتصفح، وسيضيع عند إغلاق الصفحة.</p>`;
  if (due.length > 1) h += `<h2>المراجعات المستحقة</h2><div class="list">${due.slice(0,8).map(itemRow).join('')}</div>`;
  if (S.last && !(p && S.last.s===p.s)){ const L=S.last; h += `<h2>تابع القراءة</h2><div class="list"><button class="row" data-act="open" data-s="${L.s}" data-a="${L.a}" data-b="${L.b}"><span class="num">${ar(L.s)}</span><span class="grow"><span class="t">${sName(L.s)}</span><br><span class="s">${rangeLabel(L.s,L.a,L.b)}</span></span><span class="end">${I.fwd.replace('<svg','<svg width="18" height="18"')}</span></button></div>`; }
  const [vs,va] = verseOfDay();
  h += `<h2>آية اليوم</h2><button class="card verse-card" data-act="open" data-s="${vs}" data-a="${va}" data-b="${va}"><span class="q" style="display:block">${Q[vs-1][3][va-1]}</span><span class="ref" style="display:block">سورة ${sName(vs)} · الآية ${ar(va)}</span></button>`;
  return h;
}

/* ---------- voice recitation check ----------

function heardLine(c){
  if (R.fb) return `<span class="fb">الصحيح: <q>${R.fb}</q></span>`;
  if (listening) return R.heard ? 'يسمع: '+R.heard : 'أستمع إليك… رتّل بهدوء';
  if (c.finished) return 'انتهى التسميع';
  return SR ? 'اضغط الميكروفون ورتّل، أو المس الكلمة المخفية لكشفها' : 'المس الكلمة المخفية لكشفها، أو اضغط رقم الآية لكشفها كاملة';

function commitBase(){ R.base = { st:Object.assign({},R.st), ptr:R.ptr, tries:Object.assign({},R.tries) }; }

  const ex = expected(); let j=0, fb=null;

  let started = !fresh;
  const ok = e => { R.st[e.a+':'+e.i]='ok'; R.ptr++; advancePtr(); started=true; };
  while (j<words.length && R.ptr<ex.length){
    const tent = j>=tentFrom, w=words[j], cur=ex[R.ptr], nxt=ex[R.ptr+1];

      if (k===L.length){ ok(cur); j+=k; continue; }

    }
    if (match(w,cur.n)){ ok(cur); j++; continue; }
    if (j+1<words.length && match(w+words[j+1],cur.n)){ ok(cur); j+=2; continue; }
    if (nxt && w.length>cur.n.length && match(w,cur.n+nxt.n)){ ok(cur); if (R.ptr<ex.length && ex[R.ptr]===nxt) ok(nxt); j++; continue; }
    if (!started && OPENERS.has(w)){ j++; continue; }
    if (tent) break;
    if ((R.ptr>0 && match(w,ex[R.ptr-1].n)) || (R.ptr>1 && match(w,ex[R.ptr-2].n))){ j++; continue; }
    let skip=-1; for (let k=1;k<=3;k++){ const n2=ex[R.ptr+k]; if (n2 && match(w,n2.n)){ skip=k; break; } }
    if (skip>0){ for (let k=0;k<skip;k++){ const e=ex[R.ptr]; R.st[e.a+':'+e.i]='bad'; fb=e.t; R.ptr++; } continue; }
    const key=cur.a+':'+cur.i; R.tries[key]=(R.tries[key]||0)+1;
    if (R.tries[key]>=2){ R.st[key]='bad'; fb=cur.t; R.ptr++; advancePtr(); }

}
function syncWords(){

    const st=R.st[k]; const want = st ? 'w '+(st==='given'?'':st) : (curMode()==='test' ? 'w h' : 'w');
    const cur = el.className.replace(/\s*(cur|peek)\b/g,'').trim();

}
function onWords(words, tentFrom, heardTxt){
  const before=R.ptr; restoreBase(); const fb=align(words, tentFrom);
  if (fb) R.fb=fb; else if (R.ptr>before) R.fb=null;
  if (R.ptr!==before) R.lastProgress=Date.now();
  R.heard = heardTxt.trim().split(/\s+/).slice(-6).join(' ');
  syncWords(); markCur();
  if (R.ptr>=expected().length){ commitBase(); stopListening(); R.done=true; touchDay(); save(); }
  refreshDock();
}
function resultWords(results){
  // Some Android builds repeat earlier text at the start of each new result; drop repeated prefixes.
  const parts=[]; let prev=[];
  for (let i=0;i<results.length;i++){
    let ws = results[i][0].transcript.split(/\s+/).map(norm).filter(Boolean);
    if (prev.length && ws.length>=prev.length && prev.every((x,k)=>x===ws[k])) ws = ws.slice(prev.length);
    parts.push({ws, fin:results[i].isFinal, txt:results[i][0].transcript});
    prev = results[i][0].transcript.split(/\s+/).map(norm).filter(Boolean);
  }
  return parts;
}
function startListening(){
  if (!SR){ toast('التسميع الصوتي غير مدعوم في هذا المتصفح. جرّب Chrome أو Safari، أو المس الكلمات لكشفها.'); return; }
  stopAudio();
  try {
    rec = new SR(); rec.lang='ar-SA'; rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=1;
    commitBase(); R.fb=null; R.heard=''; R.lastProgress=Date.now();
    rec.onresult = e => {
      const parts = resultWords(e.results); const words=[]; let tentFrom=Infinity, txt='';
      parts.forEach(p=>{ if (!p.fin && tentFrom===Infinity) tentFrom=words.length; words.push(...p.ws); txt+=' '+p.txt; });
      onWords(words, tentFrom, txt);
    };
    rec.onerror = e => {
      if (e.error==='not-allowed' || e.error==='service-not-allowed'){ listening=false; clearInterval(stallT); releaseWake(); toast('لم يُسمح بالميكروفون. فعّله من إعدادات المتصفح لهذا الموقع.'); refreshDock(); }
      else if (e.error==='network'){ listening=false; clearInterval(stallT); releaseWake(); toast('التعرّف على الصوت يحتاج اتصالاً بالإنترنت.'); refreshDock(); }
      else if (e.error==='language-not-supported'){ listening=false; clearInterval(stallT); toast('هذا الجهاز لا يدعم التعرّف على العربية.'); refreshDock(); }
    };
    rec.onend = () => { if (!R) return; commitBase(); if (listening){ try{ rec.start(); }catch(err){ listening=false; refreshDock(); } } };
    rec.start(); listening=true; holdWake(); refreshDock(); markCur();
    clearInterval(stallT); stallT=setInterval(stallCheck, 1000);
  } catch(err){ listening=false; toast('تعذّر تشغيل التعرّف على الصوت.'); refreshDock(); }
}
function stallCheck(){
  if (!listening || !R) { clearInterval(stallT); return; }
  if (Date.now()-(R.lastProgress||0) < 7000) return;
  const e=expected()[R.ptr]; if (!e) return;
  const el=app.querySelector(`[data-k="${e.a}:${e.i}"]`);
  if (el && el.classList.contains('h')){ el.classList.add('peek'); setTimeout(()=>el.classList.remove('peek'), 2200); }
  R.lastProgress=Date.now();
}
function stopListening(){ listening=false; clearInterval(stallT); if (rec){ try{ rec.onend=null; rec.onresult=null; rec.stop(); }catch(e){} rec=null; } if (R){ R.heard=''; } releaseWake(); }
function userHint(keys){ keys.forEach(k=>{ if (!R.st[k]) setWord(k,'hint'); }); advancePtr(); R.fb=null; R.lastProgress=Date.now(); commitBase(); markCur(); refreshDock(); }

/* ---------- audio ---------- */
const audio = new Audio(); audio.preload='auto';
let playing=false, queue=[], qi=0, rep=0, loopOne=false;
const audioUrl = (s,a) => `https://everyayah.com/data/${S.settings.reciter}/${pad3(s)}${pad3(a)}.mp3`;
function highlight(a){ app.querySelectorAll('.ayah.playing').forEach(e=>e.classList.remove('playing')); if (a){ const el=document.getElementById('ay'+a); if(el){ el.classList.add('playing'); const r=el.getBoundingClientRect(); if (r.top<110 || r.bottom>innerHeight-200) el.scrollIntoView({block:'center',behavior:reduced()?'auto':'smooth'}); } } }
function playFrom(a, only, loop){ stopListening(); queue=[]; for(let x=a;x<=(only?a:R.b);x++) queue.push(x); qi=0; rep=0; loopOne=!!loop; playing=true; holdWake(); playCur(); refreshDock(); }
function playCur(){
  if (!playing || qi>=queue.length){ stopAudio(); return; }
  const a=queue[qi]; audio.src = audioUrl(R.s, a); highlight(a);
  try { if ('mediaSession' in navigator){ navigator.mediaSession.metadata = new MediaMetadata({title:'سورة '+sName(R.s)+' · الآية '+a, artist:(RECITERS.find(r=>r[0]===S.settings.reciter)||RECITERS[0])[1], album:'رفيق الحفظ'}); } } catch(e){}
  const p = audio.play(); if (p && p.catch) p.catch(()=>failAudio());
  const nx = queue[qi+1]; if (nx){ try { const pre=new Audio(); pre.preload='auto'; pre.src=audioUrl(R.s,nx); } catch(e){} }
}
function failAudio(){ if(!playing) return; stopAudio(); toast('تعذّر تشغيل الصوت. تحقّق من الاتصال، أو افتح التطبيق من رابطه مباشرة.'); }
audio.addEventListener('ended', ()=>{ rep++; if (!loopOne && rep>=S.settings.repeat){ rep=0; qi++; } playCur(); });
audio.addEventListener('error', failAudio);
try { if ('mediaSession' in navigator){ navigator.mediaSession.setActionHandler('pause', ()=>stopAudio()); navigator.mediaSession.setActionHandler('stop', ()=>stopAudio()); } } catch(e){}
function stopAudio(){ playing=false; loopOne=false; try{ audio.pause(); }catch(e){} highlight(null); releaseWake(); if (view==='reader') refreshDock(); }
function stopAll(){ stopListening(); if (playing){ playing=false; try{audio.pause();}catch(e){} releaseWake(); } }
let wake=null;
async function holdWake(){ try { if ('wakeLock' in navigator && !wake){ wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release',()=>{ wake=null; }); } } catch(e){ wake=null; } }
function releaseWake(){ if (wake && !playing && !listening){ try{ wake.release(); }catch(e){} wake=null; } }

/* ---------- sheets ---------- */
function sheet(inner, label){ overlay.innerHTML = `<div class="sheet-bg" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="${label}">${inner}</div></div>`; const f=overlay.querySelector('.sheet button,.sheet select'); if (f) try{ f.focus({preventScroll:true}); }catch(e){} }
function closeSheet(){ overlay.innerHTML=''; confirmClear=false; }
let confirmClear=false;
function settingsSheet(){
  const st=S.settings;
  const seg=(k,opts)=>`<div class="seg" role="group">${opts.map(([v,l])=>`<button data-act="set" data-k="${k}" data-v="${v}" aria-pressed="${String(st[k])===String(v)}">${l}</button>`).join('')}</div>`;
  sheet(`<h3>الإعدادات</h3><div style="height:10px"></div>
    <div class="field"><span class="lbl">المظهر</span>${seg('theme',[['system','تلقائي'],['light','فاتح'],['dark','داكن']])}</div>
    <div class="field"><label for="rec">القارئ</label><select id="rec">${RECITERS.map(r=>`<option value="${r[0]}" ${r[0]===st.reciter?'selected':''}>${r[1]}</option>`).join('')}</select></div>
    <div class="field"><label for="fs">حجم خط المصحف</label><input id="fs" type="range" min="0.8" max="1.7" step="0.1" value="${st.size}"><div class="preview">ٱلۡحَمۡدُ لِلَّهِ رَبِّ ٱلۡعَٰلَمِينَ</div></div>
    <div class="field"><span class="lbl">الحفظ الجديد يومياً</span><div class="chips" style="padding:0">${[3,5,7,10,15,20].map(n=>`<button class="chip" data-act="set" data-k="goal" data-v="${n}" aria-pressed="${st.goal===n}">${ar(n)} آيات</button>`).join('')}</div></div>
    <div class="field"><span class="lbl">مرات التكرار عند الاستماع وعدد الترديد</span><div class="chips" style="padding:0">${[1,3,5,7,10].map(n=>`<button class="chip" data-act="set" data-k="repeat" data-v="${n}" aria-pressed="${st.repeat===n}">${ar(n)}×</button>`).join('')}</div></div>
    <div class="field"><span class="lbl">دقّة التصحيح الصوتي</span>${seg('strict',[['easy','متساهل'],['normal','متوسط'],['strict','دقيق']])}<span class="note">«متساهل» أنسب إذا كان التعرّف يخطئ في كلمات صحيحة، و«دقيق» يلتقط أخطاء النطق الواضحة أكثر.</span></div>
    <div class="field"><span class="lbl">نقطة الحفظ الحالية</span><button class="btn" data-act="startSheet" style="align-self:flex-start">${S.next?'سورة '+sName(S.next.s)+' · الآية '+ar(S.next.a)+' · تغيير':'حدّد نقطة البداية'}</button></div>
    <div class="field"><span class="lbl">البيانات</span><div class="btns"><button class="btn" data-act="export">تصدير</button><button class="btn" data-act="import">استيراد</button><button class="btn danger" data-act="clear">${confirmClear?'اضغط مجدداً لتأكيد الحذف':'حذف كل التقدّم'}</button></div><span class="note">يُحفظ تقدّمك على هذا الجهاز فقط، ولا يُرسل إلى أي جهة.</span></div>
    <div class="credit">هذا التطبيق وقفٌ مجاني لوجه الله، بلا إعلانات ولا اشتراكات.<br>نص المصحف بالرسم العثماني من <a href="https://quranenc.com" target="_blank" rel="noopener">موسوعة القرآن الكريم</a> عبر مشروع quran-json (رخصة CC BY-SA 4.0). التلاوات من <a href="https://everyayah.com" target="_blank" rel="noopener">EveryAyah</a>.<br>التصحيح الصوتي تقريبي يساعد على المراجعة، ولا يغني عن التلقّي من معلّم متقن.</div>
    <div class="btns" style="margin-top:16px"><button class="btn primary wide" data-act="close">تم</button></div>`, 'الإعدادات');
  document.getElementById('rec').addEventListener('change', e=>{ S.settings.reciter=e.target.value; save(); if(view==='reader') refreshDock(); });
  document.getElementById('fs').addEventListener('input', e=>{ S.settings.size=+e.target.value; save(); document.documentElement.style.setProperty('--qs', S.settings.size); });
}
function startSheet(){
  sheet(`<h3>من أين تبدأ الحفظ؟</h3><p class="note">يُكمل التطبيق بعدها مقطعاً يومياً تلقائياً ويتخطّى ما حفظته.</p>
    <div class="menu">
      <button data-act="setStart" data-v="amma">${I.plant}<span class="grow"><b>جزء عمّ</b><br><span class="note">من سورة الناس صعوداً</span></span></button>
      <button data-act="setStart" data-v="fatiha">${I.book}<span class="grow"><b>من أول المصحف</b><br><span class="note">الفاتحة ثم البقرة</span></span></button>
      <button data-act="setStart" data-v="pick">${I.edit}<span class="grow"><b>أختار سورة وآية</b><br><span class="note">افتح السورة واضغط رقم الآية ← «ابدأ الحفظ من هنا»</span></span></button>
    </div>`, 'نقطة البداية');
}
function ayahSheet(a){
  const v = Q[R.s-1][3][a-1];
  sheet(`<h3>سورة ${sName(R.s)} · الآية ${ar(a)}</h3><div class="q">${v}</div>
    <div class="menu">
      <button data-act="aPlay" data-a="${a}">${I.play}<span>استمع لهذه الآية</span></button>
      <button data-act="aLoop" data-a="${a}">${I.loop}<span>كرّر هذه الآية حتى أوقفها</span></button>
      <button data-act="aPlayFrom" data-a="${a}">${I.ear}<span>استمع من هنا إلى آخر المقطع</span></button>
      <button data-act="aLearn" data-a="${a}">${I.plant}<span>ابدأ الحفظ من هنا</span></button>
      <button data-act="aTest" data-a="${a}">${I.mic}<span>سمّع هذه الآية</span></button>
    </div>`, 'خيارات الآية');
}
function rangeSheet(){
  const n=nAyat(R.s); const opts=(sel)=>{ let o=''; for(let i=1;i<=n;i++) o+=`<option value="${i}" ${i===sel?'selected':''}>${ar(i)}</option>`; return o; };
  sheet(`<h3>اختر المقطع</h3><div style="height:8px"></div>
    <div class="field"><label for="ra">من الآية</label><select id="ra">${opts(R.a)}</select></div>
    <div class="field"><label for="rb">إلى الآية</label><select id="rb">${opts(R.b)}</select></div>
    <div class="btns"><button class="btn" data-act="rangeAll">السورة كاملة</button><button class="btn primary wide" data-act="rangeApply">تطبيق</button></div>`, 'اختر المقطع');
}

/* ---------- backup ---------- */
function exportData(){
  try {
    const blob = new Blob([JSON.stringify(S)], {type:'application/json'});
    const url = URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='rafeeq-alhifz-'+dkey()+'.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
    toast('جُهّز ملف النسخة الاحتياطية.');
  } catch(e){ toast('تعذّر التصدير في هذا المتصفح.'); }
}
document.getElementById('importFile').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try { const o=JSON.parse(r.result); if (!Array.isArray(o.items)) throw 0; S=Object.assign({v:2,items:[],days:[],last:null,next:null,newLog:{}},o); S.settings=Object.assign({},DEF,o.settings||{}); save(); closeSheet(); toast('استُعيد التقدّم: '+ayahWord(MEM.size)); go('today'); } catch(err){ toast('الملف غير صالح. اختر ملف نسخة احتياطية من رفيق الحفظ.'); } e.target.value=''; };
  r.readAsText(f);
});

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-act]');
  if (!t){
    if (!R || view!=='reader') return;
    const w = e.target.closest('.w');
    if (!w) return;
    if (curMode()==='test'){ if (w.classList.contains('h')) userHint([w.dataset.k]); }
    else ayahSheet(+w.dataset.a);
    return;
  }
  const act=t.dataset.act;
  if (act==='close'){ if (e.target===t || t.tagName==='BUTTON') closeSheet(); return; }
  if (t.closest('.sheet') && !['set','clear','export','import','startSheet','rangeApply'].includes(act)) closeSheet();
  switch(act){
    case 'settings': return settingsSheet();
    case 'set': { const k=t.dataset.k, v=t.dataset.v; S.settings[k] = isNaN(+v) ? v : +v; save(); applyTheme(); settingsSheet(); if (view==='reader') refreshDock(); else render(); return; }
    case 'clear': if(!confirmClear){ confirmClear=true; settingsSheet(); return; } S={v:2,items:[],days:[],last:null,next:null,newLog:{},settings:Object.assign({},DEF,{theme:S.settings.theme})}; save(); closeSheet(); toast('حُذف التقدّم'); R=null; go('today'); return;
    case 'export': return exportData();
    case 'import': return document.getElementById('importFile').click();
    case 'tab': lastTab=t.dataset.v; R=null; return go(t.dataset.v);
    case 'juz': surahFilter='j'+t.dataset.j; lastTab='surahs'; return go('surahs');
    case 'filter': surahFilter=t.dataset.f; return render();
    case 'ob': ob[t.dataset.k] = t.dataset.k==='goal' ? +t.dataset.v : t.dataset.v; return render();
    case 'obDone': S.settings.goal=ob.goal; S.settings.onboarded=true; return setStart(ob.start);
    case 'startSheet': return startSheet();
    case 'setStart': return setStart(t.dataset.v);
    case 'startReview': { const d=dueList(); if (d[0]) openReader(d[0].s,d[0].a,d[0].b,{flow:'review',itemId:d[0].id}); return; }
    case 'startLearn': { closeSheet(); const p=nextPortion(); if (p) openReader(p.s,p.a,p.b,{flow:'learn',fromPlan:true}); else startSheet(); return; }
    case 'open': lastTab = view==='surahs' ? 'surahs' : 'today'; return openReader(+t.dataset.s, +t.dataset.a||1, +t.dataset.b||0, {flow:'free'});
    case 'review': { const it=S.items.find(x=>x.id===t.dataset.id); if (it) openReader(it.s, it.a, it.b, {flow:'review', itemId:it.id}); return; }
  }
  if (!R) return;
  switch(act){
    case 'exit': stopAll(); return exitReader();
    case 'mode': stopAll(); R.mode=t.dataset.m; resetTest(); renderReader(); window.scrollTo(0,0); return;
    case 'level': stopListening(); R.level=+t.dataset.l; resetTest(); renderReader(); return;
    case 'step': stopAll(); R.step=+t.dataset.to; resetTest(); renderReader(); window.scrollTo(0,0); return;
    case 'read1': R.reads++; vib(8); refreshDock(); return;
    case 'rangeSheet': return rangeSheet();
    case 'rangeAll': return openReader(R.s,1,nAyat(R.s),{flow:'free',mode:R.mode});
    case 'rangeApply': { const a=+document.getElementById('ra').value, b=+document.getElementById('rb').value; closeSheet(); return openReader(R.s,Math.min(a,b),Math.max(a,b),{flow:'free',mode:R.mode}); }
    case 'ayah': { const a=+t.dataset.a; if (curMode()==='test'){ userHint(tokens(R.s)[a-1].map((tk,i)=>tk.m?null:a+':'+i).filter(Boolean)); } else ayahSheet(a); return; }
    case 'nextWord': { const e=expected()[R.ptr]; if (e) userHint([e.a+':'+e.i]); return; }
    case 'aPlay': return playFrom(+t.dataset.a, true, false);
    case 'aLoop': return playFrom(+t.dataset.a, true, true);
    case 'aPlayFrom': return playFrom(+t.dataset.a, false, false);
    case 'aLearn': { const a=+t.dataset.a; S.next={s:R.s,a}; if(!S.settings.onboarded) S.settings.onboarded=true; save(); const p=nextPortion(); if (p) openReader(p.s,p.a,p.b,{flow:'learn',fromPlan:true}); else toast('هذه الآيات محفوظة لديك.'); return; }
    case 'aTest': { const a=+t.dataset.a; return openReader(R.s,a,a,{flow:'free',mode:'test'}); }
    case 'play': if (playing) stopAudio(); else playFrom(R.a); return;
    case 'repeat': { const seq=[1,3,5,7,10]; S.settings.repeat = seq[(seq.indexOf(S.settings.repeat)+1)%seq.length]||1; save(); refreshDock(); return; }
    case 'mic': if (listening){ stopListening(); refreshDock(); } else startListening(); return;
    case 'reset': stopListening(); resetTest(); renderReader(); return;
    case 'reveal': stopListening(); expected().forEach(x=>{ const k=x.a+':'+x.i; if(!R.st[k]) setWord(k,'hint'); }); R.ptr=expected().length; markCur(); refreshDock(); return;
    case 'finish': stopListening(); R.done=true; refreshDock(); return;
    case 'grade': return doGrade(+t.dataset.g);
  }
});
function setStart(v){
  closeSheet();
  if (v==='amma'){ S.settings.dir='rev'; S.next={s:114,a:1}; }
  else if (v==='fatiha'){ S.settings.dir='fwd'; S.next={s:1,a:1}; }
  else { S.settings.dir='fwd'; save(); surahFilter='all'; lastTab='surahs'; go('surahs'); toast('افتح السورة واضغط رقم الآية ثم «ابدأ الحفظ من هنا»'); return; }
  save(); R=null; go('today');
}
document.addEventListener('keydown', e=>{ if (e.key==='Escape' && overlay.innerHTML) closeSheet(); });
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible' && (playing||listening)) { wake=null; holdWake(); } });

/* ---------- boot ---------- */
function boot(data){ Q=data; rebuildMem(); fromHash(); }
const inline = document.getElementById('qdata');
if (inline) boot(JSON.parse(inline.textContent));
else fetch('quran.json').then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(boot).catch(()=>{
  app.innerHTML = `<div class="loading"><div>تعذّر تحميل المصحف.</div><button class="btn primary" onclick="location.reload()">أعد المحاولة</button></div>`;
});
try { if ('serviceWorker' in navigator && location.protocol==='https:' && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register('sw.js'); } catch(e){}
})();
</script>
